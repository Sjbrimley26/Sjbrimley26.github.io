<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">How the ERP fit together</title>
  <desc id="d">Staff in sales, purchasing, production, delivery and office worked in Baserow tables (Operations, Catalog, Bill Discrepancies). n8n ran five workflow groups between Baserow and QuickBooks Online. Podium phone events went through n8n and put the caller's account on staff screens. Worksheet PDFs reached Baserow through worksheet-sync, and vendor bills reached the Bill Discrepancies table through the bill checker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a2e"/><stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b8d4ee"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Source Sans 3", sans-serif; fill: #e6eef8; font-size: 17px; }
    .h { font-family: "Playfair Display", serif; font-weight: 600; font-size: 22px; fill: #b8d4ee; }
    .title { font-family: "Playfair Display", serif; font-weight: 600; font-size: 26px; fill: #e6eef8; }
    .s { font-size: 15px; fill: #9db4cc; }
    .frame { fill: #0f2036; stroke: #5d7fa3; stroke-width: 1.5; }
    .box { fill: #16304f; stroke: #b8d4ee; stroke-width: 1.5; }
    .ext { fill: #0b1626; stroke: #7e99b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .ln { stroke: #b8d4ee; stroke-width: 2; fill: none; }
    .c { text-anchor: middle; }
  </style>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="30" y="36" class="title">ERP data flow</text>

  <!-- connectors (drawn first) -->
  <path class="ln" marker-end="url(#ah)" d="M700 80 H120 V140"/>
  <text x="400" y="70" class="s c">Screen pop on staff PCs</text>
  <path class="ln" marker-end="url(#ah)" d="M830 104 V140"/>
  <text x="845" y="126" class="s">Phone events</text>
  <path class="ln" marker-start="url(#ah)" marker-end="url(#ah)" d="M210 285 H270"/>
  <path class="ln" marker-start="url(#ah)" marker-end="url(#ah)" d="M620 285 H700"/>
  <path class="ln" marker-start="url(#ah)" marker-end="url(#ah)" d="M960 210 H1020"/>
  <path class="ln" marker-end="url(#ah)" d="M360 610 V540"/>
  <path class="ln" marker-end="url(#ah)" d="M530 610 V540"/>

  <!-- Podium -->
  <rect class="ext" x="700" y="56" width="260" height="48" rx="8"/>
  <text x="830" y="86" class="c">Podium (phones)</text>

  <!-- Staff -->
  <rect class="frame" x="30" y="140" width="180" height="290" rx="10"/>
  <text x="50" y="172" class="h">Staff</text>
  <text x="50" y="215">Sales</text>
  <text x="50" y="250">Purchasing</text>
  <text x="50" y="285">Production</text>
  <text x="50" y="320">Delivery</text>
  <text x="50" y="355">Office</text>

  <!-- Baserow -->
  <rect class="frame" x="270" y="140" width="350" height="290" rx="10"/>
  <text x="290" y="172" class="h">Baserow</text>
  <rect class="box" x="290" y="195" width="150" height="56" rx="8"/>
  <text x="365" y="229" class="c">Operations</text>
  <rect class="box" x="450" y="195" width="150" height="56" rx="8"/>
  <text x="525" y="229" class="c">Catalog</text>
  <rect class="box" x="450" y="345" width="150" height="56" rx="8"/>
  <text x="525" y="379" class="c">Bill Discrepancies</text>

  <path class="ln" marker-end="url(#ah)" d="M360 490 V260"/>
  <path class="ln" marker-end="url(#ah)" d="M530 490 V410"/>

  <!-- n8n -->
  <rect class="frame" x="700" y="140" width="260" height="290" rx="10"/>
  <text x="720" y="172" class="h">n8n</text>
  <g>
    <rect class="box" x="720" y="190" width="220" height="40" rx="8"/><text x="830" y="216" class="c">Accounting sync</text>
    <rect class="box" x="720" y="238" width="220" height="40" rx="8"/><text x="830" y="264" class="c">Shop floor</text>
    <rect class="box" x="720" y="286" width="220" height="40" rx="8"/><text x="830" y="312" class="c">Purchasing &amp; pricing</text>
    <rect class="box" x="720" y="334" width="220" height="40" rx="8"/><text x="830" y="360" class="c">Customer contact</text>
    <rect class="box" x="720" y="382" width="220" height="40" rx="8"/><text x="830" y="408" class="c">Operations</text>
  </g>

  <!-- QuickBooks -->
  <rect class="box" x="1020" y="180" width="160" height="60" rx="8"/>
  <text x="1100" y="206" class="c">QuickBooks</text>
  <text x="1100" y="228" class="c">Online</text>

  <!-- tools and sources -->
  <rect class="box" x="285" y="490" width="150" height="50" rx="8"/>
  <text x="360" y="521" class="c">worksheet-sync</text>
  <rect class="box" x="455" y="490" width="150" height="50" rx="8"/>
  <text x="530" y="521" class="c">bill checker</text>
  <rect class="ext" x="285" y="610" width="150" height="50" rx="8"/>
  <text x="360" y="641" class="c">Worksheet PDFs</text>
  <rect class="ext" x="455" y="610" width="150" height="50" rx="8"/>
  <text x="530" y="641" class="c">Vendor bills</text>

  <text x="30" y="700" class="s">How the ERP fit together (2022-2026)</text>
</svg>
